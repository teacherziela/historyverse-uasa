<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HistoryVerse 360 | Portal Guru</title><style>body{font-family:Arial,sans-serif;background:#f3efff;color:#28164a;margin:0}header{background:#42247f;color:white;padding:20px}main{max-width:1050px;margin:25px auto;padding:15px}.card{background:white;padding:24px;border-radius:15px;margin-bottom:16px;box-shadow:0 4px 18px #ddd}input,select,textarea,button{font:inherit;padding:11px;box-sizing:border-box;border-radius:8px;border:1px solid #ddd}input,textarea{width:100%;margin:8px 0 15px}button{background:#6539b3;color:white;border:0;cursor:pointer;margin:6px 6px 6px 0}button:disabled{opacity:.5}.hidden{display:none}.warn{background:#fff0cf;padding:14px;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.record{border:1px solid #ddd;border-radius:9px;padding:14px;margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f4fc;padding:14px}label{display:block}h2{margin-top:0}</style></head><body><header><b>HISTORYVERSE 360</b><div>Portal Guru · Semakan UASA Sejarah</div></header><main><div class="card warn">Portal Guru untuk akaun yang didaftarkan dalam Supabase. Penghantaran murid belum diaktifkan; senarai hanya akan menunjukkan rekod sebenar dalam pangkalan data.</div><section id="login" class="card"><h2>Log masuk guru</h2><label>E-mel guru</label><input type="email" id="email" autocomplete="username" placeholder="E-mel MOE"><label>Kata laluan Supabase</label><input type="password" id="password" autocomplete="current-password"><button id="signin">Log masuk</button><p><button id="forgot" type="button">Lupa kata laluan?</button></p><p id="status" role="status"></p></section><section id="dashboard" class="hidden"><div class="card"><h2>Senarai penghantaran murid</h2><p id="identity"></p><button id="refresh">Muat semula senarai</button><button id="signout">Log keluar</button><div class="grid"><label>Tingkatan<select id="filterForm"><option value="">Semua</option><option value="1">Tingkatan 1</option><option value="2">Tingkatan 2</option></select></label><label>Kelas<select id="filterClass"><option value="">Semua kelas</option></select></label><label>Status<select id="filterStatus"><option value="">Semua</option><option value="pending">Belum disemak</option><option value="marked">Sudah disemak</option></select></label></div><p id="total"></p><div id="list"></div></div><div class="card hidden" id="markpanel"><h2>Semak jawapan</h2><div id="detail"></div><label>Markah Bahagian A (0–20)</label><input id="ma" type="number" min="0" max="20"><label>Markah Bahagian B (0–40)</label><input id="mb" type="number" min="0" max="40"><label>Markah Bahagian C (0–20)</label><input id="mc" type="number" min="0" max="20"><label>Ulasan guru</label><textarea id="feedback" rows="5"></textarea><button id="marksave">Simpan semakan</button><p id="markstatus"></p></div></section></main><script type="module">import{createClient}from 'https://esm.sh/@supabase/supabase-js@2';const db=createClient("https://juejpoopzboukipdqawy.supabase.co","sb_publishable_Bjzi0CsTYgGtiv60roG8OA_FpmW47dk");const el=id=>document.getElementById(id);let user=null,records=[],selected=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function showAuth(ok){el('login').classList.toggle('hidden',ok);el('dashboard').classList.toggle('hidden',!ok)}async function verify(){const{data:{user:u}}=await db.auth.getUser();if(!u){user=null;showAuth(false);return}const{data,error}=await db.from('uasa_teachers').select('display_name').eq('user_id',u.id).maybeSingle();if(error||!data){await db.auth.signOut();user=null;showAuth(false);el('status').textContent='Akaun ini belum diberi akses guru.';return}user=u;showAuth(true);el('identity').textContent='Guru: '+(data.display_name||u.email);await load()}el('forgot').onclick=async()=>{const email=el('email').value.trim();if(!email){el('status').textContent='Masukkan e-mel guru dahulu.';return}const{error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});el('status').textContent=error?'Tidak berjaya: '+error.message:'Jika e-mel berdaftar, pautan reset akan dihantar. Semak peti masuk dan spam.'};async function recovery(){const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('type')==='recovery'&&hash.get('access_token')){const pass=prompt('Masukkan kata laluan baharu (minimum 8 aksara):');if(!pass)return;if(pass.length<8){alert('Kata laluan mesti sekurang-kurangnya 8 aksara.');return}const{error}=await db.auth.updateUser({password:pass});alert(error?'Gagal: '+error.message:'Kata laluan berjaya ditukar. Sila log masuk.');history.replaceState({},'',location.pathname)}}db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')setTimeout(recovery,0)});recovery();el('signin').onclick=async()=>{el('status').textContent='Sedang menyemak akaun...';const{error}=await db.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});el('password').value='';if(error){el('status').textContent='Log masuk gagal: '+error.message;return}el('status').textContent='';await verify()};el('signout').onclick=async()=>{await db.auth.signOut();user=null;showAuth(false)};async function load(){el('total').textContent='Memuatkan...';const{data,error}=await db.from('uasa_submissions').select('*').order('submitted_at',{ascending:false}).limit(1000);if(error){el('total').textContent='Tidak dapat membaca rekod: '+error.message;return}records=data||[];const classes=[...new Set(records.map(x=>x.class_name))].sort();el('filterClass').innerHTML='<option value="">Semua kelas</option>'+classes.map(x=>'<option>'+esc(x)+'</option>').join('');render()}function render(){const form=el('filterForm').value,cls=el('filterClass').value,status=el('filterStatus').value;const list=records.filter(r=>(!form||String(r.form_level)===form)&&(!cls||r.class_name===cls)&&(!status||(status==='marked'?r.marked_at:!r.marked_at)));el('total').textContent=list.length+' penghantaran dipaparkan · '+records.length+' jumlah rekod';el('list').replaceChildren();if(!list.length){el('list').textContent='Belum ada penghantaran untuk tapisan ini.';return}for(const r of list){const div=document.createElement('div');div.className='record';div.innerHTML='<b>'+esc(r.student_name)+'</b> · '+esc(r.class_name)+'<p>'+new Date(r.submitted_at).toLocaleString('ms-MY')+' · '+(r.marked_at?'Sudah disemak':'Belum disemak')+'</p>';const btn=document.createElement('button');btn.textContent='Buka dan semak';btn.onclick=()=>openRecord(r.id);div.append(btn);el('list').append(div)}}['filterForm','filterClass','filterStatus'].forEach(id=>el(id).onchange=render);el('refresh').onclick=load;function openRecord(id){selected=records.find(x=>x.id===id);if(!selected)return;el('markpanel').classList.remove('hidden');el('detail').replaceChildren();const p=document.createElement('p');p.textContent=selected.student_name+' · '+selected.class_name+' · '+new Date(selected.submitted_at).toLocaleString('ms-MY');el('detail').append(p);for(const [title,data]of [['Bahagian A',selected.answers_a],['Bahagian B',selected.answers_b],['Bahagian C',selected.answers_c]]){const h=document.createElement('h3');h.textContent=title;el('detail').append(h);const pre=document.createElement('pre');pre.textContent=JSON.stringify(data,null,2);el('detail').append(pre)}el('ma').value=selected.marks_a??'';el('mb').value=selected.marks_b??'';el('mc').value=selected.marks_c??'';el('feedback').value=selected.teacher_feedback||'';el('markstatus').textContent='';el('markpanel').scrollIntoView({behavior:'smooth'})}el('marksave').onclick=async()=>{if(!selected||!user)return;const vals=[el('ma').value,el('mb').value,el('mc').value],limits=[20,40,20];if(vals.some((x,i)=>x!==''&&(!Number.isInteger(Number(x))||Number(x)<0||Number(x)>limits[i]))){el('markstatus').textContent='Semak julat markah.';return}const{error}=await db.from('uasa_submissions').update({marks_a:vals[0]===''?null:Number(vals[0]),marks_b:vals[1]===''?null:Number(vals[1]),marks_c:vals[2]===''?null:Number(vals[2]),teacher_feedback:el('feedback').value,marked_by:user.id,marked_at:new Date().toISOString()}).eq('id',selected.id);el('markstatus').textContent=error?'Gagal menyimpan: '+error.message:'Semakan berjaya disimpan.';if(!error)await load()};verify();</script></body></html>
