<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HistoryVerse 360 | UASA Sejarah</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3efff;color:#28164a}header{background:#42247f;color:white;padding:16px 4%}h1{font-size:22px;margin:0 0 4px}header p{margin:0;font-size:14px}.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 4%;background:white;box-shadow:0 2px 10px #ddd}.bar button{border:0;border-radius:10px;background:#eee7fa;color:#43247d;font-size:16px;font-weight:bold;padding:13px 18px;cursor:pointer}.bar button.active{background:#6539b3;color:white}.bar span{font-size:13px;color:#655779;margin-left:auto}iframe{width:100%;height:calc(100vh - 145px);min-height:700px;border:0;display:block}footer{padding:10px 4%;font-size:12px;color:#655779}@media(max-width:600px){.bar span{width:100%;margin:0}iframe{height:calc(100vh - 190px)}} </style></head><body><header><h1>HISTORYVERSE 360</h1><p>Sistem UASA Sejarah Tingkatan 1 &amp; 2</p></header><nav class="bar"><button id="studentBtn" class="active" type="button">📝 Murid · Jawab &amp; Hantar</button><button id="teacherBtn" type="button">👩‍🏫 Guru · Terima &amp; Semak</button><span>Satu portal untuk murid dan guru</span></nav><iframe id="studentFrame" src="./student.html?v=fix605" title="Peperiksaan murid"></iframe><iframe id="teacherFrame" src="./teacher.html?v=4" title="Portal guru" hidden></iframe><footer>Ujian teknikal: semak kandungan soalan dan keselamatan sebelum peperiksaan sebenar.</footer><script>const sb=document.getElementById('studentBtn'),tb=document.getElementById('teacherBtn'),sf=document.getElementById('studentFrame'),tf=document.getElementById('teacherFrame');function tab(which){const teacher=which==='guru';sf.hidden=teacher;tf.hidden=!teacher;sf.style.display=teacher?'none':'block';tf.style.display=teacher?'block':'none';sb.classList.toggle('active',!teacher);t
